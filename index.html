<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Augury 3D Asset Library</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #18181b; color: #f4f4f5; max-width: 600px; margin: 80px auto; padding: 0 20px; line-height: 1.6; }
    code { background: #27272a; padding: 4px 8px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    h1 { color: #fafafa; }
    .card { background: #27272a; padding: 20px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🔮 Augury 3D Asset Library</h1>
  <p>This URL is a remote asset repository for <strong>Blender 5.2+</strong>.</p>
  
  <div class="card">
    <h3>How to Connect in Blender:</h3>
    <ol>
      <li>Go to <strong>Edit &rarr; Preferences &rarr; Asset Libraries</strong>.</li>
      <li>Click <strong>+ &rarr; Add Remote Asset Library</strong>.</li>
      <li>Enter URL: <code>https://augury-b.github.io/blender-assets/</code></li>
    </ol>
  </div>
</body>
</html>
